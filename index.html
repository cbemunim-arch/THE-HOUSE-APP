:root{--bg:#080810;--bg2:#111120;--bg3:#1a1a30;--gold:#FFD700;--gold2:#FFA500;--green:#00C896;--red:#FF4560;--pink:#FF69B4;--blue:#4FC3F7;--text:#E8E8F0;--muted:#666680;--border:#2a2a45;--r:12px}
[data-theme="light"]{--bg:#f0f2f8;--bg2:#ffffff;--bg3:#e8eaf2;--gold:#c8940a;--gold2:#e07b00;--green:#00956e;--red:#d42a42;--pink:#d44a8a;--blue:#1a88c4;--text:#1a1a2e;--muted:#888898;--border:#d0d4e8;--r:12px}
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%;background:var(--bg);font-family:'Heebo',sans-serif;color:var(--text);direction:rtl;margin:0;padding:0;transition:background .3s,color .3s}
input,select,textarea{background:var(--bg3);border:1px solid var(--border);color:var(--text);padding:8px 12px;border-radius:8px;font-family:inherit;font-size:13px;width:100%;outline:none;transition:border-color .2s,background .3s,color .3s}
input:focus,select:focus,textarea:focus{border-color:var(--gold)}
select option{background:var(--bg2)}
button{cursor:pointer;font-family:inherit;transition:all .15s}
.app{display:flex;flex-direction:column;position:fixed;top:0;left:0;right:0;bottom:0;max-width:600px;margin:0 auto;overflow:hidden}
.topbar{background:var(--bg2);border-bottom:1px solid var(--border);padding:9px 14px;display:flex;justify-content:space-between;align-items:center;flex-shrink:0}
.content{flex:1;overflow-y:auto;-webkit-overflow-scrolling:touch;padding:12px;padding-bottom:80px;min-height:0;display:block}
.content::-webkit-scrollbar{width:3px}.content::-webkit-scrollbar-thumb{background:var(--gold);border-radius:2px}
.nav{background:var(--bg2);border-top:1px solid var(--border);display:flex;justify-content:space-around;padding:5px 0;padding-bottom:max(5px,env(safe-area-inset-bottom));flex-shrink:0;position:relative;z-index:10}
.nav-btn{background:none;border:none;color:var(--muted);display:flex;flex-direction:column;align-items:center;gap:1px;font-size:9px;padding:4px 6px;border-radius:7px;min-width:44px;min-height:44px;justify-content:center;-webkit-tap-highlight-color:transparent}
.nav-btn.active{color:var(--gold);font-weight:700;transform:scale(1.08)}
.nav-btn .ni{font-size:16px}
.card{background:var(--bg2);border:1px solid var(--border);border-radius:var(--r);padding:13px;margin-bottom:9px;transition:background .3s,border-color .3s}
.gold-b{border-color:var(--gold)!important}.green-b{border-color:var(--green)!important}.pink-b{border-color:var(--pink)!important}.red-b{border-color:var(--red)!important}
.btn-gold{background:linear-gradient(135deg,var(--gold),var(--gold2));color:#000;border:none;padding:8px 16px;border-radius:9px;font-weight:700;font-size:13px;-webkit-tap-highlight-color:transparent;touch-action:manipulation}
.btn-gold:active{filter:brightness(.9)}
.btn-ghost{background:transparent;border:1px solid var(--border);color:var(--text);padding:7px 13px;border-radius:9px;font-size:13px}
.btn-ghost:hover{border-color:var(--gold);color:var(--gold)}
.btn-sm{padding:5px 10px!important;font-size:11px!important;border-radius:7px!important}
.btn-red{background:var(--red);color:#fff;border:none;padding:7px 13px;border-radius:9px;font-size:12px}
.gold{color:var(--gold)}.green{color:var(--green)}.red{color:var(--red)}.muted{color:var(--muted)}
.gs{background:linear-gradient(90deg,var(--gold),var(--gold2),var(--gold),var(--gold2));background-size:200% auto;-webkit-background-clip:text;-webkit-text-fill-color:transparent;animation:shimmer 2s linear infinite}
@keyframes shimmer{to{background-position:-200% center}}
@keyframes fadeUp{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:translateY(0)}}
@keyframes float{0%,100%{transform:translateY(0)}50%{transform:translateY(-7px)}}
@keyframes fall{to{transform:translateY(110vh) rotate(720deg);opacity:0}}
@keyframes popIn{0%{transform:scale(.7);opacity:0}80%{transform:scale(1.1)}100%{transform:scale(1);opacity:1}}
@keyframes lvlUp{0%{transform:scale(0) rotate(-10deg);opacity:0}60%{transform:scale(1.15) rotate(2deg)}100%{transform:scale(1) rotate(0);opacity:1}}
@keyframes pulse{0%,100%{opacity:1}50%{opacity:.6}}
.fade-in{animation:fadeUp .3s ease}
.hf{animation:float 3s ease-in-out infinite;display:inline-block}
.modal-ov{position:fixed;inset:0;background:rgba(0,0,0,.92);z-index:200;display:flex;align-items:center;justify-content:center;padding:14px;animation:fadeUp .2s ease}
.modal{background:var(--bg2);border:1px solid var(--gold);border-radius:16px;padding:18px;width:100%;max-width:370px;max-height:90vh;overflow-y:auto}
.xp-bar{background:var(--bg);border-radius:3px;height:4px;overflow:hidden}
.xp-fill{height:100%;background:linear-gradient(90deg,var(--gold),var(--gold2));border-radius:3px;transition:width .5s}
.pb{background:var(--bg);border-radius:5px;height:9px;overflow:hidden}
.pf{height:100%;border-radius:5px;transition:width .5s}
.row{display:flex;justify-content:space-between;align-items:center}
.g2{display:grid;grid-template-columns:1fr 1fr;gap:9px}
.g3{display:grid;grid-template-columns:repeat(3,1fr);gap:7px}
.g4{display:grid;grid-template-columns:repeat(4,1fr);gap:6px}
.st{color:var(--gold);font-size:11px;font-weight:700;margin-bottom:9px}
.toast{position:fixed;top:14px;left:50%;transform:translateX(-50%);padding:9px 18px;border-radius:11px;font-size:12px;font-weight:600;z-index:500;white-space:nowrap;pointer-events:none;animation:popIn .3s ease}
.tag{display:inline-block;font-size:9px;padding:1px 5px;border-radius:4px;font-weight:600}
.sw{transition:transform 2s cubic-bezier(.17,.67,.12,.99)}
.wp{position:relative;width:155px;height:155px;margin:0 auto 10px}
.wptr{position:absolute;top:-8px;left:50%;transform:translateX(-50%);font-size:17px;line-height:1}
.tc{position:fixed;inset:0;pointer-events:none;z-index:600;overflow:hidden}
/* Level Up Overlay */
.lvl-overlay{position:fixed;inset:0;background:rgba(0,0,0,.95);z-index:800;display:flex;flex-direction:column;align-items:center;justify-content:center;animation:fadeUp .3s ease}
.lvl-badge{font-size:80px;animation:lvlUp .6s ease forwards;margin-bottom:16px}
.lvl-text{font-size:28px;font-weight:900;text-align:center;animation:lvlUp .6s .1s ease both}
/* Badge grid */
.badge-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.badge-item{background:var(--bg3);border-radius:10px;padding:10px;text-align:center;border:1px solid var(--border)}
.badge-item.earned{border-color:var(--gold);background:#1a1a00}
.badge-item.locked{opacity:.35}
/* Chart SVG */
.chart-wrap{overflow-x:auto;padding-bottom:4px}
/* Activity feed */
.feed-item{display:flex;align-items:center;gap:8px;padding:6px 0;border-bottom:1px solid var(--border);font-size:11px}
.feed-dot{width:8px;height:8px;border-radius:50%;flex-shrink:0}
/* Annual table */
.ann-table{width:100%;border-collapse:collapse;font-size:10px}
.ann-table th{background:var(--bg3);color:var(--gold);padding:5px 6px;text-align:right;font-weight:700;position:sticky;top:0}
.ann-table td{padding:4px 6px;border-bottom:1px solid var(--border);text-align:right}
.ann-table tr:hover td{background:var(--bg3)}
.ann-table .cat-hdr td{background:var(--bg3);color:var(--gold);font-weight:700;font-size:9px}
/* PWA install */
.install-bar{background:linear-gradient(135deg,#1a1a00,#2a2a00);border:1px solid var(--gold);border-radius:10px;padding:10px 13px;margin-bottom:9px;display:flex;justify-content:space-between;align-items:center}

let fbDB = null, fbReady = false, isSyncing = false, lastSaveTs = 0;

function fbInit() {
  try {
    if (typeof firebase === 'undefined') { setTimeout(fbInit, 200); return; }
    firebase.initializeApp(FB_CONFIG);
    fbDB = firebase.database();
    fbReady = true;
    const ind = document.getElementById('sync-ind');
    if (ind) ind.style.background = '#00C896';

    // Load remote data first
    fbDB.ref('house_data').once('value').then(snap => {
      const remote = snap.val();
      if (remote) {
        const { _ts, ...remoteData } = remote;
        const localTs = S?._localTs || 0;
        // Always use remote data on first load - it's the source of truth
        S = remoteData;
        lastSaveTs = _ts || 0;
        migrate();
        try { localStorage.setItem(KEY, JSON.stringify(S)); } catch {}
        upTB(); render();
      } else {
        // First device ever — push local data up
        fbSave();
      }
      // Start listening for live changes
      fbDB.ref('house_data').on('value', snap => {
        if(isSyncing)return;
        const remote=snap.val();
        if(!remote)return;
        const{_ts,...remoteData}=remote;
        const remoteTs=_ts||0;
        if(remoteTs > lastSaveTs+500){
          isSyncing=true;
          S=remoteData; lastSaveTs=remoteTs;
          migrate();
          try{localStorage.setItem(KEY,JSON.stringify(S));}catch{}
          upTB(); render();
          const t=document.getElementById('toast');
          if(t){t.textContent='🔄 עודכן מהענן!';t.style.background='#0a1a2a';t.style.border='1px solid #4FC3F7';t.style.display='block';clearTimeout(tTmr);tTmr=setTimeout(()=>t.style.display='none',2000);}
          setTimeout(()=>isSyncing=false,800);
        }
      });;
    }).catch(e => {
      console.warn('FB load error:', e);
      const ind = document.getElementById('sync-ind');
      if (ind) ind.style.background = '#FF4560';
    });
  } catch(e) {
    console.warn('FB init error:', e);
    const ind = document.getElementById('sync-ind');
    if (ind) ind.style.background = '#FF4560';
  }
}

function fbSave() {
  if (!fbReady || !fbDB) return;
  try {
    const ts = Date.now();
    lastSaveTs = ts;
    // Clean data before saving - remove undefined values
    const clean = JSON.parse(JSON.stringify({ ...S, _ts: ts }));
    fbDB.ref('house_data').set(clean);
  } catch(e) { console.warn('FB save error:', e); }
}

function award(pid,pts,rsn,icon='💰'){
  const p=S.players.find(x=>x.id===pid);if(!p)return;
  p.pts+=pts;p.xp+=Math.max(0,pts);

}

// RECURRING EXPENSES - auto populate
// ═══════════════════════════════════════════════════════
function applyRecurringForMonth(m, y){
  // Apply recurring expenses for a specific month/year
  (S.budget.recurring||[]).forEach(r=>{
    const exists=S.budget.entries.some(e=>e.rid===r.id&&new Date(e.date).getMonth()===m&&new Date(e.date).getFullYear()===y);
    if(!exists){
      S.budget.entries.push({id:Date.now()+Math.random(),day:r.day||1,type:'exp',mc:r.mc,sc:r.sc,amt:r.amt,py:r.py||'הוראת קבע',nt:'(קבוע)',date:new Date(y,m,r.day||1).toISOString(),by:1,rid:r.id});
    }
  });
}

function applyRecurring(){
  const now=new Date();
  const curM=now.getMonth(), curY=now.getFullYear();
  // Apply for current month
  applyRecurringForMonth(curM, curY);
  // Also apply for past 11 months so history is complete
  for(let i=1;i<=11;i++){
    let m=curM-i, y=curY;
    if(m<0){m+=12;y--;}
    applyRecurringForMonth(m,y);
  }
  // Calendar reminder for current month only
  (S.budget.recurring||[]).forEach(r=>{
    const evDate=new Date(curY,curM,r.day||1);
    const evId='rec_'+r.id+'_'+curM+'_'+curY;
    if(evDate>=now&&!S.cal.events.some(e=>e.id===evId)){
      S.cal.events.push({id:evId,title:`💳 ${r.sc||r.mc}`,date:evDate.toISOString(),cat:'חשבון/תשלום',nt:`תשלום קבוע ₪${r.amt}`,auto:true});
    }
  });
  sv();
}

// Also call when budget tab is viewed, to ensure current viewed month has recurring entries
function ensureRecurringForMonth(m, y){
  if(!(S.budget.recurring||[]).length) return;
  const before=S.budget.entries.length;
  applyRecurringForMonth(m, y);
  if(S.budget.entries.length!==before) sv();
}

function doConfetti(){
  const c=document.getElementById('tc'),cols=['#FFD700','#FF6B6B','#4ECDC4','#96CEB4','#FF69B4','#fff'];
  for(let i=0;i<30;i++){
    const d=document.createElement('div');
    d.style.cssText=`position:absolute;width:${4+Math.random()*6}px;height:${4+Math.random()*6}px;border-radius:${Math.random()>0.5?'50%':'2px'};left:${Math.random()*100}%;top:-10px;background:${cols[Math.floor(Math.random()*cols.length)]};animation:fall ${1.5+Math.random()*1}s ${Math.random()*0.5}s ease-in forwards`;
    c.appendChild(d);setTimeout(()=>d.remove(),2800);
  }
}

function smartCategory(name){
  const n=name.toLowerCase();
  for(const[cat,kws]of Object.entries(SMART_CATS)){
    if(kws.some(k=>n.includes(k)))return cat;
  }
  return 'כללי';
}

function doSpin(wid,rid){
  if(spinning)return;spinning=true;const r=document.getElementById(rid);if(r)r.textContent='';
  const idx=Math.floor(Math.random()*WHL.length);sa+=1440+idx*(360/WHL.length);
  const w=document.getElementById(wid);if(w)w.style.transform=`rotate(${sa}deg)`;
  setTimeout(()=>{spinning=false;const r2=document.getElementById(rid);if(r2)r2.textContent=WHL[idx]},2100);
}

  c.innerHTML=`<div class="fade-in"><div class="row" style="margin-bottom:10px"><h2 class="gold" style="font-weight:700">💰 תקציב</h2><div style="display:flex;align-items:center;gap:5px"><button class="btn-ghost btn-sm" onclick="shBM(-1)">→</button><span style="font-size:10px;color:var(--gold)">${MNS[bM]} ${bY}</span><button class="btn-ghost btn-sm" onclick="shBM(1)">←</button></div></div>

  <div style="display:flex;gap:5px;margin-bottom:10px;overflow-x:auto">${Btn('רישום','log')}${Btn('תקציב','budget')}${Btn('השוואה','compare')}${Btn('שנתי','annual')}${Btn('ייצוא','export')}</div>

  if(bTab==='log'){setTimeout(()=>{renderMcSuggestions('');document.getElementById('mc-suggestions')&&(document.getElementById('mc-suggestions').style.display='none');document.getElementById('sc-suggestions')&&(document.getElementById('sc-suggestions').style.display='none');},30);}
}

function shBM(d){bM+=d;if(bM>11){bM=0;bY++}if(bM<0){bM=11;bY--}render()}
function updMC(){const tp=document.getElementById('bt')?.value,cats=tp==='exp'?CEX:CIN,s=document.getElementById('bmc');if(!s)return;s.innerHTML='<option value="">בחר קטגוריה...</option>'+Object.keys(cats).map(c=>`<option value="${c}">${c}</option>`).join('');updSC()}
function updSC(){const tp=document.getElementById('bt')?.value,mc=document.getElementById('bmc')?.value,cats=tp==='exp'?CEX:CIN,s=document.getElementById('bsc');if(!s)return;s.innerHTML='<option value="">בחר תת-קטגוריה...</option>'+(mc&&cats[mc]?cats[mc].map(x=>`<option>${x}</option>`).join(''):'')}
function getBudgetCatList(tp){
  const builtin=tp==='exp'?CEX:CIN;
  const custom=(S.budget.customCats||{})[tp]||{};
  const merged={};
  Object.entries(builtin).forEach(([k,v])=>merged[k]=[...v]);
  Object.entries(custom).forEach(([k,v])=>{
    if(merged[k]) merged[k]=[...new Set([...merged[k],...v])];
    else merged[k]=[...v];
  });
  return merged;
}
function renderMcSuggestions(val){
  const tp=document.getElementById('bt')?.value||'exp';
  const cats=Object.keys(getBudgetCatList(tp));
  const v=(val||'').toLowerCase();
  const matches=v?cats.filter(c=>c.toLowerCase().includes(v)):cats;
  const d=document.getElementById('mc-suggestions');
  if(!d)return;
  if(matches.length===0){d.style.display='none';return;}
  d.innerHTML=matches.map(c=>`<div onmousedown="selectMc('${c.replace(/'/g,"\\'")}')"  style="padding:8px 10px;font-size:13px;cursor:pointer;border-bottom:1px solid var(--border)">${c}</div>`).join('');
  d.style.display='block';
}
function selectMc(cat){
  pBud._mc=cat; pBud._sc='';
  document.getElementById('bmc-search').value=cat;
  document.getElementById('bsc-search').value='';
  const d=document.getElementById('mc-suggestions'); if(d)d.style.display='none';
}
function renderScSuggestions(val){
  const tp=document.getElementById('bt')?.value||'exp';
  const mc=pBud._mc||'';
  const cats=getBudgetCatList(tp);
  const subs=cats[mc]||[];
  const v=(val||'').toLowerCase();
  const matches=v?subs.filter(s=>s.toLowerCase().includes(v)):subs;
  const d=document.getElementById('sc-suggestions');
  if(!d)return;
  if(matches.length===0){d.style.display='none';return;}
  d.innerHTML=matches.map(s=>`<div onmousedown="selectSc('${s.replace(/'/g,"\\'")}')" style="padding:8px 10px;font-size:13px;cursor:pointer;border-bottom:1px solid var(--border)">${s}</div>`).join('');
  d.style.display='block';
}
function selectSc(sub){
  pBud._sc=sub;
  document.getElementById('bsc-search').value=sub;
  const d=document.getElementById('sc-suggestions'); if(d)d.style.display='none';
}
function logBud(){
  const tp=document.getElementById('bt').value;
  const mc=(pBud._mc||document.getElementById('bmc-search')?.value||'').trim();
  const sc=(pBud._sc||document.getElementById('bsc-search')?.value||'').trim();
  const amt=parseFloat(document.getElementById('bam').value);
  const py=document.getElementById('bpy').value;
  const nt=document.getElementById('bnt').value;
  const day=parseInt(document.getElementById('bd').value);
  const isRec=document.getElementById('brec').checked;
  if(!mc||!amt){toast('נא למלא קטגוריה וסכום','err');return}
  // Save new category/subcategory if not in built-in lists
  const builtin=tp==='exp'?CEX:CIN;
  if(!S.budget.customCats)S.budget.customCats={exp:{},inc:{}};
  if(!S.budget.customCats[tp])S.budget.customCats[tp]={};
  const isNewMc=!Object.keys(builtin).includes(mc);
  if(isNewMc&&!S.budget.customCats[tp][mc]) S.budget.customCats[tp][mc]=[];
  if(sc){
    const existingSubs=builtin[mc]||[];
    const customSubs=S.budget.customCats[tp][mc]||[];
    if(!existingSubs.includes(sc)&&!customSubs.includes(sc)){
      if(!S.budget.customCats[tp][mc])S.budget.customCats[tp][mc]=[];
      S.budget.customCats[tp][mc].push(sc);
    }
  }
  const id=Date.now();
  const en={id,day,type:tp,mc,sc,amt,py,nt,date:new Date(bY,bM,day).toISOString(),by:ga().id};
  if(isRec){const rid='r'+id;S.budget.recurring.push({id:rid,day,mc,sc,amt,py});en.rid=rid;toast('🔁 נוסף כהוצאה קבועה!')}
  S.budget.entries.unshift(en);
  const mE=S.budget.entries.filter(e=>{const d=new Date(e.date);return d.getMonth()===bM&&d.getFullYear()===bY});
  const tgt=S.budget.targets[mc]||0,used=mE.filter(e=>e.mc===mc&&e.type==='exp').reduce((a,e)=>a+e.amt,0);
  if(tp==='exp'&&tgt>0&&used<=tgt){en.saved=true;award(ga().id,20,'חסכת ב'+mc,'💰')}
  else if(tp==='exp'&&tgt>0&&used>tgt)award(ga().id,-15,'חריגה ב'+mc,'⚠️');
  else{sv();toast('✅ נרשם')}
  pBud._mc='';pBud._sc='';
  checkAllBadges();render();
}

function exportCSV(){
  const mEall=S.budget.entries.filter(e=>{const d=new Date(e.date);return d.getMonth()===bM&&d.getFullYear()===bY});
  const csv=['יום,סוג,קטגוריה,תת-קטגוריה,סכום,תשלום,הערה',...mEall.map(e=>`${e.day},${e.type==='inc'?'הכנסה':'הוצאה'},${e.mc},${e.sc||''},${e.amt},${e.py},${e.nt||''}`)].join('\n');
  const blob=new Blob(['\uFEFF'+csv],{type:'text/csv;charset=utf-8'});
  const a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download=`budget_${MNS[bM]}_${bY}.csv`;a.click();
}

function pCal(c){
  const now=new Date();
  // Auto-refresh Google Calendar if older than 7 days
  if(S.cal.gcTok&&(!S.cal.gcLastFetch||Date.now()-S.cal.gcLastFetch>604800000))setTimeout(refGC,800);

  const [calYear,setCalYear]=[typeof pCal._y!=='undefined'?pCal._y:now.getFullYear(),v=>{pCal._y=v;render();}];
  const [calMonth,setCalMonth]=[typeof pCal._m!=='undefined'?pCal._m:now.getMonth(),v=>{pCal._m=v;render();}];
  const calY=typeof pCal._y!=='undefined'?pCal._y:now.getFullYear();
  const calM=typeof pCal._m!=='undefined'?pCal._m:now.getMonth();

  const firstDay=new Date(calY,calM,1);
  const lastDay=new Date(calY,calM+1,0);
  const startDow=firstDay.getDay(); // 0=Sun
  const daysInMonth=lastDay.getDate();
  const allEvs=[...S.cal.events,...(S.cal.gcEvs||[])];

  function getEventsForDay(d){
    return allEvs.filter(e=>{
      const ed=new Date(e.date);
      return ed.getFullYear()===calY&&ed.getMonth()===calM&&ed.getDate()===d;
    });
  }

  const catColors={'חשבון/תשלום':'#FF4560','יום הולדת':'#FF69B4','תור':'#4FC3F7','יום נישואין':'#FFD700','בית ספר':'#00C896','כללי':'#888'};

  // Build calendar grid
  let gridCells='';
  // Empty cells before first day
  for(let i=0;i<startDow;i++) gridCells+=`<div style="min-height:52px"></div>`;
  for(let d=1;d<=daysInMonth;d++){
    const evs=getEventsForDay(d);
    const isToday=d===now.getDate()&&calM===now.getMonth()&&calY===now.getFullYear();
    const dots=evs.slice(0,3).map(e=>`<div style="width:5px;height:5px;border-radius:50%;background:${catColors[e.cat||e.category]||'#888'};display:inline-block;margin:0 1px"></div>`).join('');
    gridCells+=`<div onclick="pCal._sel=${d};render()" style="min-height:52px;background:${isToday?'rgba(255,215,0,0.15)':pCal._sel===d?'var(--bg3)':'transparent'};border:1px solid ${isToday?'var(--gold)':pCal._sel===d?'var(--border)':'transparent'};border-radius:8px;padding:4px;cursor:pointer;text-align:center">
      <div style="font-size:12px;font-weight:${isToday?700:400};color:${isToday?'var(--gold)':'var(--text)'}">${d}</div>
      <div style="margin-top:3px">${dots}</div>
      ${evs.length>3?`<div style="font-size:8px;color:var(--muted)">+${evs.length-3}</div>`:''}
    </div>`;
  }

  // Selected day events
  const selEvs=pCal._sel?getEventsForDay(pCal._sel):[];
  const selHtml=selEvs.length?`<div class="card" style="margin-bottom:9px">
    <div class="st">${pCal._sel} ${MNS[calM]} — ${selEvs.length} אירועים</div>
    ${selEvs.map(e=>`<div style="display:flex;align-items:center;gap:8px;padding:7px 0;border-bottom:1px solid var(--border)">
      <div style="width:8px;height:8px;border-radius:50%;background:${catColors[e.cat||e.category]||'#888'};flex-shrink:0"></div>
      <div style="flex:1"><div style="font-size:12px;font-weight:500">${e.title}${e.gcal?'<span class="tag" style="background:#1a3a1a;color:#4CAF50;margin-right:3px">G</span>':''}</div>
      ${e.nt||e.note?`<div style="font-size:9px;color:var(--muted)">${e.nt||e.note}</div>`:''}
      </div>
      ${!e.gcal&&!e.auto?`<button onclick="S.cal.events=S.cal.events.filter(x=>x.id!=='${e.id}');sv();render()" style="background:none;border:none;color:var(--muted);cursor:pointer;font-size:12px">🗑</button>`:''}
    </div>`).join('')}
  </div>`:'';

  // Upcoming events (next 30 days)
  const upcoming=allEvs.filter(e=>new Date(e.date)>=now).sort((a,b)=>new Date(a.date)-new Date(b.date)).slice(0,8);

  c.innerHTML=`<div class="fade-in">
    <div class="row" style="margin-bottom:10px">
      <h2 class="gold" style="font-weight:700">📅 יומן</h2>
      <button class="btn-gold btn-sm" onclick="togEF()">+ אירוע</button>
    </div>

    <!-- Google Calendar panel -->
    <div class="card" style="margin-bottom:9px;border-color:${S.cal.gcTok?'var(--green)':'var(--border)'}">
      <div class="row">
        <div>
          <div style="font-size:12px;font-weight:600;margin-bottom:2px">📆 Google Calendar</div>
          <div style="font-size:9px;color:${S.cal.gcTok?'var(--green)':'var(--muted)'}">${S.cal.gcTok?`✅ מחובר — ${S.cal.gcEvs?.length||0} אירועים${S.cal.gcLastFetch?' • עודכן '+new Date(S.cal.gcLastFetch).toLocaleDateString('he-IL'):''}`:' לא מחובר'}</div>
        </div>
        <div style="display:flex;gap:5px">
          ${!S.cal.gcTok?`<button class="btn-gold btn-sm" onclick="conGC()">🔗 חבר</button>`:`<button class="btn-gold btn-sm" onclick="refGC()">🔄 רענן</button><button class="btn-ghost btn-sm" onclick="S.cal.gcTok=null;S.cal.gcEvs=[];sv();render()">נתק</button>`}
        </div>
      </div>
    </div>

    <!-- Anniversary -->
    <div class="card" style="margin-bottom:9px">
      <div style="font-size:11px;font-weight:600;color:var(--pink);margin-bottom:5px">💍 יום נישואין</div>
      <div style="display:flex;gap:8px;align-items:center">
        <input type="date" id="ann-in" value="${S.cal.anniversary||''}" style="flex:1">
        <button class="btn-gold btn-sm" onclick="saveAnn()">שמור</button>
      </div>
    </div>

    <!-- Add event form -->
    <div id="evf" style="display:none"><div class="card gold-b" style="margin-bottom:9px">
      <div class="st">אירוע חדש</div>
      <input id="et" placeholder="כותרת" style="margin-bottom:7px">
      <div class="g2" style="margin-bottom:7px">
        <div><div style="font-size:9px;color:var(--muted);margin-bottom:2px">תאריך</div><input type="date" id="ed"></div>
        <div><div style="font-size:9px;color:var(--muted);margin-bottom:2px">שעה</div><input type="time" id="eh"></div>
      </div>
      <select id="ec" style="margin-bottom:7px"><option>כללי</option><option>חשבון/תשלום</option><option>יום הולדת</option><option>תור</option><option>יום נישואין</option><option>בית ספר</option></select>
      <input id="en2" placeholder="הערה" style="margin-bottom:9px">
      <div style="display:flex;gap:7px"><button class="btn-gold" onclick="addEv()">שמור</button><button class="btn-ghost" onclick="togEF()">ביטול</button></div>
    </div></div>

    <!-- Month navigator -->
    <div class="card" style="margin-bottom:9px">
      <div class="row" style="margin-bottom:10px">
        <button class="btn-ghost btn-sm" onclick="pCal._m=(pCal._m===undefined?new Date().getMonth():pCal._m);pCal._y=(pCal._y===undefined?new Date().getFullYear():pCal._y);if(pCal._m===0){pCal._y--;pCal._m=11;}else{pCal._m--;}render()">→</button>
        <span style="font-weight:700;color:var(--gold)">${MNS[calM]} ${calY}</span>
        <button class="btn-ghost btn-sm" onclick="pCal._m=(pCal._m===undefined?new Date().getMonth():pCal._m);pCal._y=(pCal._y===undefined?new Date().getFullYear():pCal._y);if(pCal._m===11){pCal._y++;pCal._m=0;}else{pCal._m++;}render()">←</button>
      </div>
      <!-- Day headers -->
      <div style="display:grid;grid-template-columns:repeat(7,1fr);gap:2px;margin-bottom:4px">
        ${['א','ב','ג','ד','ה','ו','ש'].map(d=>`<div style="text-align:center;font-size:9px;color:var(--muted);font-weight:600">${d}</div>`).join('')}
      </div>
      <!-- Grid -->
      <div style="display:grid;grid-template-columns:repeat(7,1fr);gap:2px">
        ${gridCells}
      </div>
    </div>

    <!-- Selected day detail -->
    ${selHtml}

    <!-- Upcoming list -->
    ${upcoming.length?`<div class="card">
      <div class="st">אירועים קרובים (${upcoming.length})</div>
      ${upcoming.map(e=>{const dl=Math.ceil((new Date(e.date)-now)/864e5);return`<div style="display:flex;justify-content:space-between;align-items:center;padding:8px 0;border-bottom:1px solid var(--border)">
        <div style="display:flex;align-items:center;gap:7px">
          <div style="width:6px;height:6px;border-radius:50%;background:${catColors[e.cat||e.category]||'#888'};flex-shrink:0"></div>
          <div><div style="font-size:11px;font-weight:500">${e.title}${e.gcal?'<span class="tag" style="background:#1a3a1a;color:#4CAF50;margin-right:3px">G</span>':''}</div>
          <div style="font-size:9px;color:var(--muted)">${new Date(e.date).toLocaleDateString('he-IL')}</div></div>
        </div>
        <span style="background:${dl<=3?'#3a1a1a':'#1a2a1a'};color:${dl<=3?'var(--red)':'var(--green)'};border-radius:5px;padding:2px 6px;font-size:9px;font-weight:600">${dl===0?'היום!':dl+'d'}</span>
      </div>`}).join('')}
    </div>`:''}
  </div>`;
}

function logDt(){const date=document.getElementById('rd').value,act=document.getElementById('ra').value;if(!date||!act){toast('נא למלא תאריך ופעילות','err');return}S.rom.dates.unshift({id:Date.now(),date,act,loc:document.getElementById('rl').value,nt:document.getElementById('rn').value,rating:parseInt(document.getElementById('rr').value),by:ga().id,photo:pendingPhoto});pendingPhoto=null;award(ga().id,30,'דייט רומנטי 💕','💕');checkAllBadges();render()}

function pDin(c){
  const now=new Date();const ws=new Date(now);ws.setDate(now.getDate()-now.getDay()+dWk*7);
  const days=Array.from({length:7},(_,i)=>{const d=new Date(ws);d.setDate(ws.getDate()+i);return d});
  c.innerHTML=`<div class="fade-in"><div class="row" style="margin-bottom:10px"><h2 class="gold" style="font-weight:700">🍽️ תפריט שבועי</h2><div style="display:flex;gap:5px"><button class="btn-ghost btn-sm" onclick="dWk--;render()">→</button><button class="btn-ghost btn-sm" onclick="dWk=0;render()">היום</button><button class="btn-ghost btn-sm" onclick="dWk++;render()">←</button></div></div>
  ${days.map((day,i)=>{const key=day.toDateString(),plan=S.din.plans[key],isT=key===now.toDateString();
    return`<div class="card" style="margin-bottom:7px;border-color:${isT?'var(--gold)':'var(--border)'}"><div class="row"><div><span style="font-weight:${isT?700:500};color:${isT?'var(--gold)':'var(--text)'};font-size:12px">${DNS[i]}</span> <span style="font-size:9px;color:var(--muted)">${day.toLocaleDateString('he-IL')}</span></div>${plan?.done?'<span style="color:var(--green);font-size:10px">✅</span>':''}</div>
    ${plan?`<div style="margin-top:5px"><div style="font-size:13px;font-weight:500">${plan.meal||'ארוחה'}</div><div style="font-size:9px;color:var(--muted)">${plan.type}${plan.cook?` • ${S.players.find(p=>p.id==plan.cook)?.avatar||''} ${S.players.find(p=>p.id==plan.cook)?.name||''}`:''}</div>${plan.nt?`<div style="font-size:9px;color:#aaa">${plan.nt}</div>`:''}<div style="display:flex;gap:5px;margin-top:5px">${!plan.done?`<button class="btn-gold btn-sm" onclick="doneDin('${key}')">✅ הוכן (+5)</button>`:''}<button class="btn-ghost btn-sm" onclick="togDE('${key}')">✏️</button></div></div>`:`<button onclick="togDE('${key}')" style="background:none;border:1px dashed var(--border);color:var(--muted);border-radius:6px;padding:4px 9px;font-size:10px;cursor:pointer;margin-top:5px;width:100%">+ תכנן ארוחה</button>`}
    <div id="de-${key}" style="display:none;margin-top:7px"><input id="dm-${key}" placeholder="שם הארוחה" value="${plan?.meal||''}" style="margin-bottom:5px"><select id="dt-${key}" style="margin-bottom:5px">${['בישול בבית','הזמנה','שאריות','ארוחה מהירה'].map(t=>`<option${plan?.type===t?' selected':''}>${t}</option>`).join('')}</select><select id="dc-${key}" style="margin-bottom:5px"><option value="">מי מבשל?</option>${S.players.map(p=>`<option value="${p.id}"${plan?.cook==p.id?' selected':''}>${p.avatar} ${p.name}</option>`).join('')}</select><input id="dn-${key}" placeholder="הערות" value="${plan?.nt||''}" style="margin-bottom:7px"><div style="display:flex;gap:5px"><button class="btn-gold btn-sm" onclick="saveDin('${key}')">שמור</button><button class="btn-ghost btn-sm" onclick="togDE('${key}')">ביטול</button></div></div>
    </div>`;
  }).join('')}</div>`;
}
function togDE(k){const f=document.getElementById('de-'+k);if(f)f.style.display=f.style.display==='none'?'block':'none'}
function saveDin(k){S.din.plans[k]={meal:document.getElementById('dm-'+k).value,type:document.getElementById('dt-'+k).value,cook:document.getElementById('dc-'+k).value,nt:document.getElementById('dn-'+k).value,done:false};sv();render()}
function doneDin(k){const p=S.din.plans[k];if(!p)return;p.done=true;const cook=p.cook?parseInt(p.cook):ga().id;award(cook,5,'בישלת ארוחה 🍳','🍳');checkAllBadges();render()}

  const ld=(tid)=>{const x=S.tasks.comp.filter(c=>c.tid===tid).sort((a,b)=>b.ts-a.ts)[0];return x?new Date(x.ts).toLocaleDateString('he-IL'):null};
  const lw=(tid)=>{const x=S.tasks.comp.filter(c=>c.tid===tid).sort((a,b)=>b.ts-a.ts)[0];return x?S.players.find(p=>p.id===x.pid):null};
  c.innerHTML=`<div class="fade-in"><div class="row" style="margin-bottom:10px"><h2 class="gold" style="font-weight:700">✅ משימות</h2><button class="btn-gold btn-sm" onclick="togATF()">+ משימה</button></div>
  <div class="card" style="margin-bottom:10px"><div class="st">🏆 ליגת השבוע</div>
    <div class="g3" style="margin-bottom:6px">${pc.slice(0,3).map((p,i)=>`<div style="text-align:center;background:var(--bg3);border-radius:9px;padding:7px 3px;border:1px solid ${i===0?'var(--gold)':i===1?'var(--muted)':'#654321'}"><div style="font-size:${i===0?17:12}px">${i===0?'🥇':i===1?'🥈':'🥉'}</div><div style="font-size:17px">${p.avatar}</div><div style="font-size:8px;font-weight:600">${p.name}</div><div style="font-size:14px;font-weight:700;color:${i===0?'var(--gold)':'var(--muted)'}">${p.cnt}</div></div>`).join('')}</div>
    ${pc.slice(3).map(p=>`<div style="display:flex;justify-content:space-between;font-size:10px;color:var(--muted);padding:2px 0">${p.avatar} ${p.name}<span>${p.cnt}</span></div>`).join('')}
  </div>
  <div id="atf" style="display:none"><div class="card gold-b" style="margin-bottom:9px"><div class="st">משימה חדשה</div>
    <div style="display:flex;gap:7px;margin-bottom:7px"><input id="nti" value="✅" style="width:46px"><input id="ntn" placeholder="שם המשימה"></div>
    <div class="g2" style="margin-bottom:9px"><select id="ntf"><option>יומי</option><option selected>שבועי</option><option>לפי צורך</option></select><select id="nta"><option value="">לא מוקצה</option>${S.players.map(p=>`<option value="${p.id}">${p.avatar} ${p.name}</option>`).join('')}</select></div>
    <div style="display:flex;gap:7px"><button class="btn-gold" onclick="addTsk()">הוסף</button><button class="btn-ghost" onclick="togATF()">ביטול</button></div>
  </div></div>
  <div class="g2">${S.tasks.list.map(task=>{const asgn=task.assigned?S.players.find(p=>p.id==task.assigned):null,ldd=ld(task.id),lww=lw(task.id);return`<div style="background:var(--bg3);border:1px solid var(--border);border-radius:11px;padding:11px;text-align:center;position:relative"><button onclick="S.tasks.list=S.tasks.list.filter(t=>t.id!=${task.id});sv();render()" style="position:absolute;top:5px;left:5px;background:none;border:none;color:var(--muted);cursor:pointer;font-size:10px">✕</button><div style="font-size:25px;margin-bottom:2px">${task.icon}</div><div style="font-weight:600;font-size:11px;margin-bottom:1px">${task.name}</div><div style="font-size:8px;color:var(--muted);margin-bottom:2px">${task.freq}</div>${asgn?`<div style="font-size:10px;color:var(--gold);margin-bottom:2px">${asgn.avatar} ${asgn.name}</div>`:'<div style="height:14px"></div>'}<div style="font-size:8px;color:#555;margin-bottom:5px">${ldd?`${ldd}${lww?' '+lww.avatar:''}`:' '}</div><button class="btn-gold" style="width:100%;font-size:10px;padding:5px" onclick="openTM(${task.id})">✅ בוצע (+10)</button></div>`}).join('')}</div></div>`;

function getAllItems(){
  const builtin=Object.values(SHOP_DB).flat();
  const custom=S.shop.customItems||[];
  return [...new Set([...builtin,...custom])];
}

function selectSuggestion(name){
  pShp._search=name;
  document.getElementById('shsearch').value=name;
  const cat=findCatForItem(name);
  if(cat) pShp._cat=cat;
  render();
}

function findCatForItem(name){
  for(const[cat,items]of Object.entries(SHOP_DB)){
    if(items.some(i=>i.toLowerCase()===name.toLowerCase())) return cat;
  }
  if((S.shop.customItems||[]).some(i=>i.toLowerCase()===name.toLowerCase())){
    return (S.shop.customCats&&S.shop.customCats[name])||null;
  }
  return null;
}

function tapItem(name,cat){
  const existing=S.shop.items.find(i=>i.nm===name&&i.cat===cat&&!i.bought);
  if(existing){
    existing.qty=(existing.qty||1)+1;
  } else {
    S.shop.items.unshift({id:Date.now(),nm:name,cat,rec:false,bought:false,by:ga().id,price:0,qty:1});
  }
  sv();render();
}

function changeQty(id,delta){
  const item=S.shop.items.find(i=>i.id===id);
  if(!item)return;
  item.qty=(item.qty||1)+delta;
  if(item.qty<=0){
    S.shop.items=S.shop.items.filter(i=>i.id!==id);
  }
  sv();render();
}

function quickAddShp(){
  const name=(pShp._search||document.getElementById('shsearch')?.value||'').trim();
  if(!name)return;
  const cat=pShp._cat||Object.keys(SHOP_DB)[0];
  const price=parseFloat(document.getElementById('shp')?.value)||0;
  const rec=document.getElementById('shr')?.checked||false;
  const qty=parseInt(document.getElementById('shqty')?.value)||1;
  const existing=S.shop.items.find(i=>i.nm.toLowerCase()===name.toLowerCase()&&i.cat===cat&&!i.bought);
  if(existing){
    existing.qty=(existing.qty||1)+qty;
  } else {
    S.shop.items.unshift({id:Date.now(),nm:name,cat,rec,bought:false,by:ga().id,price,qty});
  }
  const known=getAllItems().map(n=>n.toLowerCase());
  if(!known.includes(name.toLowerCase())){
    if(!S.shop.customItems)S.shop.customItems=[];
    S.shop.customItems.push(name);
    if(!S.shop.customCats)S.shop.customCats={};
    S.shop.customCats[name]=cat;
  }
  pShp._search='';
  pShp._qty=1;
  sv();render();
}

function togShp(id){const i=S.shop.items.find(x=>x.id===id);if(!i)return;i.bought=!i.bought;i.boughtBy=ga().id;sv();render()}
function doneShp(){
  if(!S.shop.items.filter(i=>!i.rec).every(i=>i.bought)){toast('Not all items checked off!','err');return}
  const total=S.shop.items.reduce((a,i)=>a+(i.price||0)*(i.qty||1),0);
  if(total>0){
    const now=new Date();
    S.budget.entries.unshift({id:Date.now(),day:now.getDate(),type:'exp',mc:'מזון ופארמה',sc:'קניות מכולת',amt:total,py:'אשראי',nt:'Shopping - from list',date:now.toISOString(),by:ga().id});
    toast(`🛒 $${total.toFixed(0)} added to budget`);
  }
  S.shop.trips=(S.shop.trips||0)+1;
  award(ga().id,15,'Shopping trip complete! 🛒','🛒');
  S.shop.items=S.shop.items.filter(i=>i.rec).map(i=>({...i,bought:false}));
  checkAllBadges();sv();render();
}

// ═══════════════════════════════════════════════════════
// DATA SHARING / QR / EXPORT
// ═══════════════════════════════════════════════════════
function exportAllJSON(){
  const blob=new Blob([JSON.stringify(S,null,2)],{type:'application/json'});
  const a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download='house_backup_'+Date.now()+'.json';a.click();
  toast('💾 גיבוי הורד!');
}

function importJSON(input){
  const file=input.files[0];if(!file)return;
  const r=new FileReader();
  r.onload=e=>{try{S=JSON.parse(e.target.result);sv();upTB();render();toast('✅ נתונים שוחזרו!');}catch{toast('שגיאה בקובץ','err')}};
  r.readAsText(file);
}

function openQR(){
  // Simple QR using Google Charts API (free, no key needed)
  const data=btoa(unescape(encodeURIComponent(JSON.stringify(S)))).slice(0,1000); // truncated for QR size
  const qrUrl=`https://api.qrserver.com/v1/create-qr-code/?size=180x180&data=${encodeURIComponent('HAW:'+data)}`;
  document.getElementById('qr-canvas').innerHTML=`<img src="${qrUrl}" style="border-radius:8px;border:2px solid var(--gold)">`;
  document.getElementById('qrm').style.display='flex';
}

function importFromClipboard(){
  navigator.clipboard.readText().then(txt=>{
    try{const d=JSON.parse(decodeURIComponent(escape(atob(txt.replace('HAW:','')))));S=d;sv();upTB();render();toast('✅ נתונים יובאו!');document.getElementById('qrm').style.display='none';}catch{toast('שגיאה בנתונים','err')}
  }).catch(()=>toast('לא ניתן לגשת ללוח','err'));
}

function chkOAuth(){
  const h=window.location.hash;

}

function resetMyPoints(){
  if(!confirm('לאפס רק את הנקודות שלך?')) return;
  const p = S.players.find(x=>x.id===S.aId);
  if(p){ p.pts=0; p.xp=0; p.lvl=1; p.badges=[]; }
  S.log = S.log.filter(l=>l.pid!==S.aId);
  sv();
  render();
  toast('🔄 הנקודות שלך אופסו');
}
function fullReset(){
  if(!confirm('למחוק את כל הנתונים לכולם? פעולה זו תמחק גם מהענן ולא ניתן לשחזר!')) return;
  // Clear Firebase first
  if(fbReady && fbDB){
    fbDB.ref('house_data').remove().then(()=>{
      localStorage.removeItem(KEY);
      location.reload();
    }).catch(()=>{
      // Firebase remove failed, still clear local
      localStorage.removeItem(KEY);
      location.reload();
    });
  } else {
    localStorage.removeItem(KEY);
    location.reload();
  }
}

function applyTheme(mode){
  document.documentElement.setAttribute('data-theme', mode);
  const btn = document.getElementById('theme-btn');
  if(btn) btn.textContent = mode==='light' ? '🌙' : '☀️';
}
function toggleTheme(){
  const current = document.documentElement.getAttribute('data-theme');
  const next = current==='light' ? 'dark' : 'light';
  document.documentElement.setAttribute('data-theme', next==='dark' ? '' : 'light');
  const btn = document.getElementById('theme-btn');
  if(btn) btn.textContent = next==='light' ? '🌙' : '☀️';
  try{ localStorage.setItem('haw_theme', next); } catch{}
}
function loadTheme(){
  try{
    const saved = localStorage.getItem('haw_theme');
    if(saved==='light'){
      document.documentElement.setAttribute('data-theme','light');
      const btn = document.getElementById('theme-btn');
      if(btn) btn.textContent = '🌙';
    }
  } catch{}
}

function conGC(){
  const p=new URLSearchParams({client_id:'711890972270-l4jvaduhoc7ightcg3hmkasdtuvkfi8t.apps.googleusercontent.com',redirect_uri:'https://cbemunim-arch.github.io/THE-HOUSE-APP/',response_type:'token',scope:'https://www.googleapis.com/auth/calendar.readonly',state:'gcal'});
  window.open('https://accounts.google.com/o/oauth2/v2/auth?'+p,'gcal','width=520,height=620');
}
async function refGC(){
  if(!S.cal.gcTok){toast('לא מחובר','err');return;}
  try{
    const tMin=new Date().toISOString();
    const tMax=new Date(Date.now()+90*864e5).toISOString();
    const res=await fetch(`https://www.googleapis.com/calendar/v3/calendars/primary/events?timeMin=${encodeURIComponent(tMin)}&timeMax=${encodeURIComponent(tMax)}&singleEvents=true&orderBy=startTime&maxResults=100`,{headers:{Authorization:'Bearer '+S.cal.gcTok}});
    if(!res.ok)throw new Error('auth');
    const data=await res.json();
    S.cal.gcEvs=(data.items||[]).map(e=>({id:'gc'+e.id,title:e.summary||'אירוע',date:e.start?.dateTime||e.start?.date+'T09:00:00',cat:'כללי',note:e.description||'',gcal:true}));
    S.cal.gcLastFetch=Date.now();
    sv();
    toast(`📅 ${S.cal.gcEvs.length} אירועים עודכנו`);
    render();
  }catch(err){
    if(err.message==='auth'){S.cal.gcTok=null;S.cal.gcEvs=[];sv();toast('פג תוקף — התחבר מחדש','err');}
    else toast('שגיאה בטעינה','err');
    render();
  }
}
function saveAnn(){const v=document.getElementById('ann-in').value;S.cal.anniversary=v||null;sv();toast('💍 יום נישואין נשמר!');render()}
function togEF(){const f=document.getElementById('evf');if(f)f.style.display=f.style.display==='none'?'block':'none'}
function addEv(){
  const t=document.getElementById('et').value,d=document.getElementById('ed').value,h=document.getElementById('eh').value||'09:00',cat=document.getElementById('ec').value,nt=document.getElementById('en2').value;
  if(!t||!d){toast('נא למלא כותרת ותאריך','err');return;}
  S.cal.events.push({id:'ev'+Date.now(),title:t,date:new Date(`${d}T${h}`).toISOString(),cat,nt,by:ga().id});
  sv();toast('📅 נוסף!');render();
}
function chkOAuth(){
  const h=window.location.hash;
  if(h.includes('access_token')&&h.includes('gcal')){
    const p=new URLSearchParams(h.replace('#','?')),tok=p.get('access_token');
    if(tok){S.cal.gcTok=tok;sv();window.location.hash='';toast('✅ Google Calendar מחובר!');pg='calendar';render();setTimeout(refGC,500)}
  }
}

function appInit() {
  try {
    loadTheme();
    ld();
    applyRecurring();
    upTB();
    renderNav();
    render();
    chkOAuth();
    checkAllBadges();
    setTimeout(fbInit, 300);
  } catch(e) {
    document.getElementById('content').innerHTML='<div style="padding:20px;color:#ff4560;font-size:12px;direction:ltr"><b>Init Error:</b><br>'+e.message+'<br><pre style="font-size:10px;margin-top:8px;white-space:pre-wrap">'+e.stack+'</pre></div>';
    console.error('Init error:', e);
  }
}
if (document.readyState === 'loading') {
  document.addEventListener('DOMContentLoaded', appInit);
} else {
  setTimeout(appInit, 50);
}
